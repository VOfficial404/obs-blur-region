name: Check Format
on:
  # Pull requests call this through pr-pull.yaml; pushes to main run it only when code or CMake files change,
  # so docs, version bumps and release tags no longer start a run. Runs are titled with the commit message.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.clang-format'
      - '.gersemirc'
permissions:
  contents: read
concurrency:
  # Own prefix: inside a pull request run, github.workflow is the caller's name and would share its group.
  group: 'check-format @ ${{ github.ref }}'
  cancel-in-progress: true
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
